[package]
name = "merlin-python"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Optional native Python bindings for the MERLIN high-level Rust API"

[lib]
name = "merlin"
crate-type = ["cdylib"]

[workspace]

[dependencies]
docsis-ofdm-fec = { path = "../../crates/ofdm", features = ["high-level-api"] }
pnm-input = { path = "../../crates/pnm-input" }
pyo3 = { version = "=0.30.1", features = ["extension-module", "multiple-pymethods"] }
serde_json = "=1.0.145"
