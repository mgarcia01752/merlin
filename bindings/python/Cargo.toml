[package]
name = "merlin-python"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Optional native Python bindings for the MERLIN high-level Rust API"

[lib]
name = "_native"
crate-type = ["cdylib"]

[workspace]

[dependencies]
merlin = { path = "../../crates/merlin", features = ["native-input"] }
pyo3 = { version = "=0.30.1", features = ["extension-module", "multiple-pymethods"] }
serde_json = "=1.0.145"
