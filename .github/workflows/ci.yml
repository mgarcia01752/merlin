name: Master
'on':
  push:
    branches:
      - main
      - master
  pull_request: null
  workflow_dispatch: null
  workflow_call:
    inputs:
      release:
        description: Build and package a validated release tag
        type: boolean
        default: false
  schedule:
    - cron: 17 11 * * 1
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Rust components
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-${{ runner.os }}-${{ runner.arch }}-1.85.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: core-${{ runner.os }}-${{ runner.arch }}-1.85.1-
      - name: Versions, helpers and style
        run: |
          python tools/release/versions.py
          python tools/development/check_sources.py
          cargo test --manifest-path third-party/pnm/Cargo.toml --workspace --locked
          python -m unittest discover -s tools/release -p 'test_*.py'
          python -m unittest discover -s tools/python -p 'test_*.py'
          python -m unittest discover -s tools/git/tests -p 'test_*.py'
          python -m unittest discover -s tools/packaging -p 'test_*.py'
          python -m unittest discover -s tools/validation -p 'test_*.py'
          python tools/validation/qt_api_boundary.py
          python -m unittest discover -s tools/development/tests -p 'test_*.py'
          bash -n scripts/check-before-push.sh
          shellcheck scripts/*.sh tools/git/*.sh tools/bump-version.sh
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
  native:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            executable: ofdm-fec
          - name: ubuntu-24.04-x64
            os: ubuntu-24.04
            executable: ofdm-fec
          - name: ubuntu-26.04-x64
            os: ubuntu-26.04
            executable: ofdm-fec
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

            local/test-tools
          key: native-${{ matrix.name }}-1.85.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-${{ matrix.name }}-1.85.1-
      - name: Simulation and feature-boundary tests
        run: |
          MERLIN_TEST_THREADS=4 scripts/test-local.sh all
      - name: Retain API example timing and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-example-timing-${{ matrix.name }}
          path: local/api-example-tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and exercise native CLI
        run: |
          cargo build -p ofdm-fec-cli --locked ${{ inputs.release && '--release' || '' }}
          python tools/packaging/native_smoke.py --binary target/${{ inputs.release && 'release' || 'debug' }}/${{ matrix.executable }}
      - name: Build archive and native installer after successful tests
        if: inputs.release && github.ref_type == 'tag' && matrix.os == 'ubuntu-22.04'
        run: |
          python tools/packaging/package.py --binary target/release/${{ matrix.executable }} --output dist/${{ matrix.name }} --native
      - uses: actions/upload-artifact@v6
        if: inputs.release && github.ref_type == 'tag' && matrix.os == 'ubuntu-22.04'
        with:
          name: merlin-assets-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 7
  codeql:
    name: Rust source analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Initialize Rust CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
  dependency-security:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Audit Cargo.lock against RustSec
        run: |
          scripts/security-audit.sh
      - name: Retain dependency audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rustsec-audit-report
          path: local/security-audit/*report.json
          if-no-files-found: warn
          retention-days: 7
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      QT_SDK_DIR: ${{ github.workspace }}/local/qt/6.8.3/gcc_64
      CARGO_HOME: ${{ github.workspace }}/local/merlin-cargo
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            local/cargo
            local/rustup
            local/merlin-cargo
            local/qt
            local/qt-tools
            local/release-sources
            apps/qt/target
          key: desktop-ubuntu22-qt6.8.3-rust1.85.1-${{ hashFiles('apps/qt/Cargo.lock', 'Cargo.lock', 'tools/development/qt_sdk.py') }}
          restore-keys: desktop-ubuntu22-qt6.8.3-rust1.85.1-
      - name: Prefer reachable Ubuntu HTTPS mirrors on this runner
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' https://archive.ubuntu.com/ubuntu https://security.ubuntu.com/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - name: Prepare pinned Ubuntu development tools
        run: |
          env -u QT_SDK_DIR ./install.sh --development
      - name: Validate versions, packaging and desktop
        run: |
          scripts/qt-desktop.sh check
      - name: Build optimized desktop
        run: |
          export PATH="$QT_SDK_DIR/bin:$PWD/local/cargo/bin:$PATH"
          export QMAKE="$QT_SDK_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_SDK_DIR/lib"
          export RUSTUP_HOME="$PWD/local/rustup"
          scripts/cargo-local.sh build --manifest-path apps/qt/Cargo.toml --release --locked
        if: inputs.release && github.ref_type == 'tag'
      - name: Build native desktop DEB and checksums
        run: |
          export PATH="$PWD/local/cargo/bin:$PATH"
          export RUSTUP_HOME="$PWD/local/rustup"
          python3 tools/packaging/desktop.py --binary apps/qt/target/release/merlin-qt \
            --qt-sdk "$QT_SDK_DIR" --output dist/desktop
          python3 tools/packaging/desktop_smoke.py --deb dist/desktop/merlin-desktop_*.deb --output dist/desktop-check
        if: inputs.release && github.ref_type == 'tag'
      - name: Install, reinstall and remove on disposable runner
        run: |
          sudo apt-get install -y ./dist/desktop/merlin-desktop_*.deb
          python3 tools/packaging/desktop_smoke.py --installed
          sudo apt-get install --reinstall -y ./dist/desktop/merlin-desktop_*.deb
          python3 tools/packaging/desktop_smoke.py --installed
          sudo apt-get remove -y merlin
          test ! -e /usr/bin/merlin
          test ! -e /usr/lib/merlin
          test ! -e /usr/share/applications/merlin.desktop
          test ! -e /usr/share/icons/hicolor/256x256/apps/merlin.png
        if: inputs.release && github.ref_type == 'tag'
      - uses: actions/upload-artifact@v6
        with:
          name: merlin-assets-desktop-ubuntu22-amd64
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 14
        if: inputs.release && github.ref_type == 'tag'
  windows-desktop:
    name: Windows x64 desktop UI
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      QT_SDK_DIR: ${{ github.workspace }}/local/qt/6.8.3/msvc2022_64
      CARGO_HOME: ${{ github.workspace }}/local/merlin-cargo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure native MSVC x64 environment
        run: ./scripts/windows/setup-msvc-ci.ps1
      - uses: actions/cache@v5
        with:
          path: |
            local/qt
            local/qt-tools
            local/merlin-cargo
            local/release-sources
            apps/qt/target
          key: desktop-windows-x64-qt6.8.3-rust1.85.1-${{ hashFiles('apps/qt/Cargo.lock', 'Cargo.lock', 'tools/development/qt_sdk.py') }}
          restore-keys: desktop-windows-x64-qt6.8.3-rust1.85.1-
      - name: Prepare pinned Rust and Qt tools
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          ./scripts/windows/qt-desktop.ps1 setup
      - name: Validate adapter, QML and native UI build
        run: ./scripts/windows/qt-desktop.ps1 check
      - name: Retain Windows QML diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merlin-windows-qml-evidence
          path: dist/windows-qml-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Configure WiX 3.14.1
        if: inputs.release && github.ref_type == 'tag'
        run: |
          $WixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14/bin'
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          }
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) { throw 'WiX3 tools missing' }
          $WixVersion = [version](Get-Item "$WixBin/candle.exe").VersionInfo.FileVersion
          if ($WixVersion.Major -ne 3 -or $WixVersion.Minor -ne 14 -or $WixVersion.Build -ne 1) {
            throw "Expected WiX 3.14.1, found $WixVersion"
          }
          "WIX_BIN=$WixBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and package Windows desktop MSI
        if: inputs.release && github.ref_type == 'tag'
        run: ./scripts/windows/qt-desktop.ps1 package
      - name: Verify installed UI, repair and uninstall
        if: inputs.release && github.ref_type == 'tag'
        run: ./scripts/windows/test-installed.ps1
      - name: Retain native packaging and installer evidence
        if: always() && inputs.release && github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: merlin-windows-installer-evidence
          path: |
            dist/windows-desktop-report.json
            dist/windows-installer-logs/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: inputs.release && github.ref_type == 'tag'
        with:
          name: merlin-assets-desktop-windows-amd64
          path: dist/windows-desktop/
          if-no-files-found: error
          retention-days: 14

  python-installer:
    name: Python installer (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-26.04
            python: '3.14'
          - os: windows-2022
            python: '3.14'
    env:
      PYTHONPATH: ''
      RUSTUP_TOOLCHAIN: 1.85.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Configure MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/setup-msvc-ci.ps1
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Installer contract tests
        run: python -m unittest discover -s scripts/python-api -p "test_*.py"
      - name: Check Python-only installer requirements
        shell: bash
        run: ./install.sh --install-pymerlin --check
      - name: Build and install only the Python API
        shell: bash
        run: ./install.sh --install-pymerlin --venv local/installer-ci
      - name: Read installed version (no simulation)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            local/installer-ci/Scripts/python.exe -I -c 'import merlin; print(merlin.__version__)'
          else
            local/installer-ci/bin/python -I -c 'import merlin; print(merlin.__version__)'
          fi

  python-wheels:
    name: Release Python wheel (${{ matrix.name }})
    if: inputs.release && github.ref_type == 'tag'
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu22-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            shell: bash
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: x64
      - name: Configure native MSVC x64 environment
        if: runner.os == 'Windows'
        run: ./scripts/windows/setup-msvc-ci.ps1
      - name: Install pinned Rust and wheel builder
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          python -m pip install --only-binary=:all: maturin==1.8.3
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/python/target
          key: python-wheel-${{ matrix.name }}-cp310-rust1.85.1-${{ hashFiles('bindings/python/Cargo.lock') }}
          restore-keys: python-wheel-${{ matrix.name }}-cp310-rust1.85.1-
      - name: Fetch locked native wheel dependencies
        run: cargo fetch --manifest-path bindings/python/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Build native wheel with dependency notices
        run: python tools/python/build_wheel.py --out local/release-python-wheels
      - name: Install wheel and run actual single-capture API example
        run: >-
          python tools/python/smoke_wheel.py --wheel-dir local/release-python-wheels
          --output dist/python-wheel-${{ matrix.name }}
          --report dist/python-wheel-${{ matrix.name }}-test.json
      - name: Retain wheel test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merlin-python-wheel-evidence-${{ matrix.name }}
          path: dist/python-wheel-${{ matrix.name }}-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain only tested release wheels
        uses: actions/upload-artifact@v6
        with:
          name: merlin-assets-python-${{ matrix.name }}
          path: dist/python-wheel-${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 14

  ubuntu-compatibility:
    name: Release package compatibility (${{ matrix.os }})
    if: inputs.release && github.ref_type == 'tag'
    needs: [desktop, python-wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: x64
      - uses: actions/download-artifact@v7
        with:
          name: merlin-assets-python-ubuntu22-x64
          path: local/compatibility-wheel
      - uses: actions/download-artifact@v7
        with:
          name: merlin-assets-desktop-ubuntu22-amd64
          path: local/compatibility-desktop
      - name: Verify original Ubuntu 22.04 artifact checksums
        run: |
          (cd local/compatibility-wheel && sha256sum --check SHA256SUMS)
          (cd local/compatibility-desktop && sha256sum --check SHA256SUMS)
      - name: Install baseline wheel and run actual Python example
        run: >-
          python tools/python/smoke_wheel.py --wheel-dir local/compatibility-wheel
          --output dist/compatibility-${{ matrix.os }}
          --report dist/compatibility-${{ matrix.os }}-test.json
      - name: Install, exercise, reinstall and remove baseline desktop DEB
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y ./local/compatibility-desktop/merlin-desktop_*.deb
          python tools/packaging/desktop_smoke.py --installed
          sudo apt-get install --reinstall -y ./local/compatibility-desktop/merlin-desktop_*.deb
          python tools/packaging/desktop_smoke.py --installed
          sudo apt-get remove -y merlin
          test ! -e /usr/bin/merlin
          test ! -e /usr/lib/merlin
          test ! -e /usr/share/applications/merlin.desktop
          test ! -e /usr/share/icons/hicolor/256x256/apps/merlin.png
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merlin-compatibility-evidence-${{ matrix.os }}
          path: |
            dist/compatibility-${{ matrix.os }}-test.json
            docs/development/local/desktop-installed-check/
          if-no-files-found: warn
          retention-days: 14
