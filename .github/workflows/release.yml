name: Native CLI release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify release tag and canonical version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python3 tools/release/versions.py
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: [version, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: merlin-assets-*
          path: dist/native
      - name: Verify and collect successful native packages
        run: >-
          python3 tools/packaging/collect_release.py --source dist/native --output dist/release
          --expected-artifacts merlin-assets-linux-x64
      - name: Publish tested CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/packaging/release_notes.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --output dist/release-notes.md
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag \
            --title "MERLIN $RELEASE_TAG" --notes-file dist/release-notes.md
