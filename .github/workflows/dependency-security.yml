name: Dependency security
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '37 11 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Audit Cargo.lock against RustSec
        run: scripts/security-audit.sh
      - name: Retain dependency audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rustsec-audit-report
          path: local/security-audit/*report.json
          if-no-files-found: warn
          retention-days: 7
