[package]
name = "pnm-input"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Optional bounded native PNM and file adapter for MERLIN"

[dependencies]
base64 = "=0.22.1"
docsis-ofdm-fec = { path = "../ofdm", features = ["high-level-api"] }
pnm = { git = "https://github.com/PyPNMApps/PNM-Viewer-Toolkit.git", rev = "5fbd5561f3e06b73486546b5ffa520279080a5eb", version = "=0.3.6" }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[[example]]
name = "run_single_capture"
path = "../../examples/api/rust/run_single_capture.rs"

[[example]]
name = "run_rxmer_selection_parity"
path = "../../examples/api/rust/run_rxmer_selection_parity.rs"

[[example]]
name = "run_multi_rxmer_cmce_workbench"
path = "../../examples/api/rust/run_multi_rxmer_cmce_workbench.rs"

[[example]]
name = "run_multi_rxmer_mce"
path = "../../examples/api/rust/run_multi_rxmer_mce.rs"

[[example]]
name = "run_multi_rxmer_cm_chan_est"
path = "../../examples/api/rust/run_multi_rxmer_cm_chan_est.rs"

[[example]]
name = "run_designed_rxmer"
path = "../../examples/api/rust/run_designed_rxmer.rs"
