[package]
name = "docsis-ofdm-fec"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Offline OFDM profile analysis and experimental LDPC/BCH simulation"

[features]
default = ["simulation"]
source-input = []
pnm-input = ["dep:serde_json", "dep:sha2"]
simulation = ["dep:fec-codec", "dep:rand", "dep:rand_chacha", "dep:rand_distr", "dep:serde_json", "dep:sha2"]

[dependencies]
log.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
fec-codec = { path = "../fec-codec", optional = true }
rand = { version = "=0.9.5", optional = true }
rand_chacha = { version = "=0.9.0", optional = true }
rand_distr = { version = "=0.5.1", optional = true }

serde_json = { version = "=1.0.145", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
serde_json = "=1.0.145"

[[example]]
name = "qam256_codec_loop"
required-features = ["simulation"]

[[example]]
name = "symbol_packing"
required-features = ["simulation"]

[[example]]
