[package]
name = "docsis-ofdm-fec"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Offline OFDM profile analysis and experimental LDPC/BCH simulation"

[features]
default = ["simulation"]
simulation = ["dep:fec-codec", "dep:rand", "dep:rand_chacha", "dep:rand_distr"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
fec-codec = { path = "../fec-codec", optional = true }
rand = { version = "=0.9.2", optional = true }
rand_chacha = { version = "=0.9.0", optional = true }
rand_distr = { version = "=0.5.1", optional = true }

[dev-dependencies]
serde_json = "=1.0.145"

[[example]]
name = "qam256_codec_loop"
required-features = ["simulation"]

[[example]]
name = "symbol_packing"
required-features = ["simulation"]
