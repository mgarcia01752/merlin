[package]
name = "docsis-ofdma"
description = "Safe bounded DOCSIS upstream OFDMA stages"
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
merlin-api = { path = "../phy-api" }
fec-codec = { path = "../fec-codec" }
merlin-dsp = { path = "../dsp" }
serde = { version = "=1.0.228", features = ["derive"] }

rand = "=0.9.5"
rand_chacha = "=0.9.0"
rand_distr = "=0.5.1"

serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
